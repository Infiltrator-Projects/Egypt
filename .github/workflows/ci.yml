name: Egypt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-no-window-system:
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-latest' || 'linux-native' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authored graphical UI surfaces
        run: |
          python3 tools/build_hud_assets.py build-ui
          printf '%s  %s\n' 'd16206ec528caa645a5f70ca2b24020c47304d6f00e823b0690c373605609218' 'build-ui/hud_chrome.e8p' | sha256sum -c -
          printf '%s  %s\n' 'ebe86b2076ca98cd2bf09d14aa8ab857d6bceea384074c65b0bbcfe7ff6eb25f' 'build-ui/hud_glyphs.e8p' | sha256sum -c -
          printf '%s  %s\n' 'a90d9a515e9613e4e4e13b6b61592d115de89ec44375313b669741a9f5df3c14' 'build-ui/tool_icons.e8p' | sha256sum -c -

      - name: Configure without host backend
        run: cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DEGYPT_HOST_BACKEND=none

      - name: Build platform-neutral game core
        run: cmake --build build-core --target egypt-game-core-compile egypt-world-smoke --parallel

      - name: Test platform-neutral core
        run: ctest --test-dir build-core --output-on-failure

  linux-x11-host-adapter:
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-latest' || 'linux-native' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 host-adapter headers
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libx11-dev

      - name: Verify self-hosted X11 dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake ctest dpkg-deb pkg-config python3; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists x11

      - name: Configure generic X11 host adapter
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEGYPT_HOST_BACKEND=x11 -DEGYPT_BUILD_PROFILE=generic

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify generic Debian package
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-deb.sh build-package dist
          deb="dist/egypt_0.1.0_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "egypt"
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - > package-files.txt
          grep -qx './usr/bin/egypt' package-files.txt
          grep -qx './usr/share/egypt/assets/menu.e16' package-files.txt
          grep -qx './usr/share/egypt/assets/hud_chrome.e8p' package-files.txt
          grep -qx './usr/share/egypt/assets/hud_glyphs.e8p' package-files.txt
          grep -qx './usr/share/egypt/assets/tool_icons.e8p' package-files.txt

      - name: Verify hardware-native source install
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DEGYPT_HOST_BACKEND=x11 \
            -DEGYPT_BUILD_PROFILE=native
          cmake --build build-native --parallel
          ctest --test-dir build-native --output-on-failure
          rm -rf native-stage
          DESTDIR="$PWD/native-stage" cmake --install build-native --component Runtime
          test -x native-stage/usr/bin/egypt
          test -s native-stage/usr/share/egypt/assets/menu.e16
          test -s native-stage/usr/share/egypt/assets/hud_chrome.e8p

      - name: Upload generic Debian package
        uses: actions/upload-artifact@v4
        with:
          name: egypt-linux-amd64
          path: dist/egypt_0.1.0_amd64.deb
          if-no-files-found: error
